<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chef Lógico</title>
<style>
:root{--fg:#2b2118;--card:#fffaf0;--bd:#2b2118;--ok:#2e7d32;--bad:#c62828;--ac:#e8590c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#f4ecd8;--card:#2b241b;--bd:#f4ecd8;--ok:#66bb6a;--bad:#ef5350;--ac:#ff922b}}
:root[data-theme="dark"]{--fg:#f4ecd8;--card:#2b241b;--bd:#f4ecd8;--ok:#66bb6a;--bad:#ef5350;--ac:#ff922b}
html,body{margin:0;height:100%;overflow:hidden;background:#d39b55;font-family:"Courier New",monospace}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;image-rendering:pixelated}
.ov{position:fixed;box-sizing:border-box}
.card{background:var(--card);color:var(--fg);border:3px solid var(--bd);padding:8px 12px;font-size:clamp(11px,1.3vw,14px)}
#ord{left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));color:#fff;font-size:clamp(12px,1.7vw,18px);line-height:1.5;pointer-events:none;text-shadow:0 0 3px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
#ord .t{font-weight:bold;margin-bottom:2px}#ord small{display:block;font-size:.72em;margin-top:4px;opacity:.9}
#task{left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));text-align:center;max-width:36vw;pointer-events:none}
#task b{display:block;font-size:clamp(14px,1.9vw,21px)}#task small{display:block;margin-top:3px;opacity:.85}
#q{right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:min(380px,34vw);max-height:70vh;overflow:auto}
#q button{display:block;width:100%;margin:4px 0;padding:7px;font:inherit;background:var(--card);color:var(--fg);border:2px solid var(--bd);cursor:pointer;text-align:left}
#q button:hover{background:var(--ac);color:#fff}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
#msg{left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));color:#fff;font-size:clamp(12px,1.5vw,16px);text-align:center;pointer-events:none;text-shadow:0 0 3px #000,1px 1px 0 #000,-1px -1px 0 #000;max-width:90vw}
#pad{left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#pad button{width:44px;height:44px;font:inherit;font-size:18px;background:var(--card);color:var(--fg);border:2px solid var(--bd);opacity:.85}
#hint{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));color:#fff;font-size:11px;text-shadow:1px 1px 0 #000;pointer-events:none}
@media(max-width:760px){#task{top:calc(86px + env(safe-area-inset-top,0px));max-width:70vw}#q{top:calc(150px + env(safe-area-inset-top,0px));width:min(92vw,340px)}#hint{display:none}}

html,body{background:#79bcf0}
#ord{pointer-events:auto;cursor:grab;touch-action:none;user-select:none;background:#fff7dc;color:#2b2118;text-shadow:none;border:2px solid #cdb67c;padding:16px 16px 10px;box-shadow:4px 4px 0 rgba(0,0,0,.35);transform:rotate(-1.5deg);min-width:150px;background-image:repeating-linear-gradient(transparent 0 20px,rgba(60,90,160,.2) 20px 21px)}
#ord::before{content:"";position:absolute;top:-9px;left:50%;width:46px;height:15px;background:rgba(222,200,120,.85);transform:translateX(-50%) rotate(2deg)}
#zoom{position:fixed;inset:0;display:none;background:rgba(10,8,4,.6);z-index:9;align-items:center;justify-content:center}
#zf{transform:translate(var(--dx,0),var(--dy,0)) scale(.1);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .25s;width:min(760px,90vw);position:relative}
#zoom.on #zf{transform:none;opacity:1}
.fo{border:10px solid #3f6fa8;box-shadow:inset 0 0 0 3px #7fb0e0,0 0 0 4px #1d2a38,8px 8px 0 rgba(0,0,0,.4);background:#2d4f7a;padding:10px;position:relative}
.fi{border:6px solid #5b8cc4;box-shadow:inset 0 0 0 3px #1d2a38;background:#1d2a38}
.gl{position:relative;height:min(340px,46vh);background:linear-gradient(#34495e,#1f2a36);overflow:hidden}
.bx{position:absolute;bottom:0;background:#7a5c2e;box-shadow:inset 0 6px 0 #9a7a42,inset 0 0 0 3px #4a3a1c}.b1{right:6%;width:16%;height:34%}.b2{right:20%;width:12%;height:22%;background:#5a6f7a}
.ln{position:absolute;left:0;top:6px;width:100%;height:22px}
.tw{position:absolute;top:22px;width:27%;transform:rotate(var(--r));filter:drop-shadow(3px 4px 0 rgba(0,0,0,.45))}
.tk{background:#fffdf2;color:#2b2118;padding:18px 10px 26px;font-size:clamp(11px,1.6vw,16px);min-height:150px;clip-path:polygon(0 0,100% 0,100% 92%,88% 100%,76% 93%,62% 100%,50% 93%,38% 100%,24% 93%,12% 100%,0 93%);position:relative;line-height:1.5}
.tk::before{content:"";position:absolute;top:5px;left:50%;width:10px;height:10px;background:#d63a2f;transform:translateX(-50%)}
.tk b{display:block;border-bottom:2px dashed #b9a97a;margin-bottom:6px}
.rv{position:absolute;width:10px;height:10px;background:#dcebf8;box-shadow:inset -2px -2px 0 #7fa3c9,0 0 0 2px #1d2a38}.r1{left:-1px;top:-1px}.r2{right:-1px;top:-1px}.r3{left:-1px;bottom:-1px}.r4{right:-1px;bottom:-1px}
#zvar{color:#dcebf8;font-size:12px;margin:8px 0 6px;text-align:center}#zok{display:block;margin:0 auto;padding:8px 18px;font:inherit;font-weight:bold;background:#fffdf2;color:#2b2118;border:3px solid #1d2a38;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.4)}

#q{background:#fffaf0;color:#2b2118;border:3px solid #2a3b4a;box-shadow:5px 5px 0 rgba(0,0,0,.4);padding:0;overflow:auto;width:min(400px,36vw)}
.qh{background:#3f6fa8;color:#fff;display:flex;justify-content:space-between;padding:7px 12px;font-weight:bold;font-size:12px;letter-spacing:1px;box-shadow:inset 0 -3px 0 #2d4f7a}
.qb{padding:10px 12px 12px}.qp{height:6px;background:#d9e2ea;margin-bottom:10px}.qp i{display:block;height:100%;background:#5fb04a}
.qt{margin:4px 0 12px;line-height:1.7;font-size:clamp(12px,1.35vw,14px)}
.kw{font-style:normal;font-weight:bold;padding:1px 6px;margin:0 2px;color:#fff;box-shadow:1px 1px 0 rgba(0,0,0,.35)}.k1{background:#2e7d32}.k2{background:#e8590c}.k3{background:#7b5fb0}
#q button{display:flex;gap:10px;align-items:center;width:100%;margin:6px 0;padding:6px 10px 6px 6px;font:inherit;background:#fff;color:#2b2118;border:2px solid #2a3b4a;box-shadow:3px 3px 0 rgba(0,0,0,.25);cursor:pointer;text-align:left}
#q button:hover{background:#ffe9a8;transform:translate(-1px,-1px)}
#q button em{font-style:normal;font-weight:bold;background:#2a3b4a;color:#fff;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
@keyframes pop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}#q.pop{animation:pop .25s ease-out}
#pick{position:fixed;inset:0;display:none;background:rgba(10,8,4,.6);z-index:9;align-items:center;justify-content:center}
#pkf{transform:translate(var(--dx,0),var(--dy,0)) scale(.1);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .25s;width:min(560px,92vw);border:10px solid #cfd9e2;background:#e9f2f8;box-shadow:inset 0 0 0 3px #fff,0 0 0 4px #1d2a38,8px 8px 0 rgba(0,0,0,.4);color:#2b2118}
#pick.on #pkf{transform:none;opacity:1}
#pkf.wd{border-color:#9a5f2e;background:#6b3f1d;box-shadow:inset 0 0 0 3px #b9783a,0 0 0 4px #2a1608,8px 8px 0 rgba(0,0,0,.4);color:#f6e3bd}
.pkh{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-weight:bold}.pkh button{font:inherit;cursor:pointer;border:2px solid #1d2a38;background:#fff;color:#2b2118}
.sh{display:flex;gap:10px;padding:10px;justify-content:center;border-bottom:8px solid #9aa5b1;background:linear-gradient(#f4f9fc,#dbe8f1)}
.wd .sh{border-bottom-color:#b9783a;background:#8a5a2b}
.it{width:96px;background:rgba(255,255,255,.75);border:3px solid #2a3b4a;padding:6px 2px;font:inherit;font-size:12px;cursor:pointer;text-align:center;color:#2b2118}.it:hover{background:#ffe9a8}.it.out{opacity:.45}
.it img{width:60px;height:45px;image-rendering:pixelated;display:block;margin:0 auto 4px}
#pkm{padding:8px 12px;font-size:13px;text-align:center;min-height:20px}
#pad{display:none}@media (pointer:coarse){#pad{display:flex}}
.it img{width:84px;height:63px}

#me{display:none;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));background:#fffaf0;color:#2b2118;border:3px solid #2a3b4a;box-shadow:3px 3px 0 rgba(0,0,0,.4);padding:6px 12px;font-size:14px;z-index:6}
#rkb{display:none;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font:inherit;font-weight:bold;background:linear-gradient(#ffd23c,#e0a800);color:#2a1608;border:3px solid #2a1608;box-shadow:3px 3px 0 rgba(0,0,0,.45);padding:8px 14px;cursor:pointer;z-index:7}
#rkb:hover{filter:brightness(1.1)}
#rk{display:none;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(320px,88vw);background:#fffaf0;color:#2b2118;border:3px solid #2a1608;box-shadow:5px 5px 0 rgba(0,0,0,.45);z-index:7}
.rkh{background:#2a3b4a;color:#ffd23c;padding:7px 12px;font-weight:bold;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}.rkh small{font-weight:normal;color:#9fe49b;font-size:10px}
#rkl,#rkS{padding:6px}
.rr{display:flex;align-items:center;gap:8px;padding:5px 8px;margin:3px 0;background:#f3ecd8;border-left:5px solid #b9a97a;font-size:14px}
.rr b{width:20px;text-align:center}.rr .hw{width:34px;display:inline-flex;justify-content:center}.rr .hw img{width:32px;height:21px;image-rendering:pixelated}.rr.first .hw img{filter:drop-shadow(0 0 4px #ffd23c);animation:flt 2.4s ease-in-out infinite}
.rr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rr em{font-style:normal;font-weight:bold;color:#b5502a}
.rr.first{background:linear-gradient(90deg,#fff1b0,#ffe27a);border-left-color:#e0a800;font-weight:bold}.rr.me{outline:2px solid #3f6fa8}.rr.empty{border-left-color:transparent;background:none;font-size:12px}
@keyframes fl{0%{background:#9fe49b;transform:scale(1.04)}100%{transform:none}}.rr.flash{animation:fl .9s ease-out}
#rkclr{display:none;margin:6px;width:calc(100% - 12px);font:inherit;font-weight:bold;background:#e0463a;color:#fff;border:3px solid #2a1608;padding:7px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at center,rgba(255,214,90,.28),rgba(20,30,70,.6));transition:opacity .55s,transform .55s;overflow:hidden}
#start.out{opacity:0;transform:scale(1.1);pointer-events:none}
.hero{display:flex;align-items:center;gap:clamp(8px,2vw,30px)}
.hero img{image-rendering:pixelated;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));animation:flt 2.4s ease-in-out infinite}
.hero .chf{height:clamp(70px,16vh,150px)}.hero .brg{width:clamp(70px,14vw,150px);animation-delay:.6s}
@keyframes flt{50%{transform:translateY(-10px) rotate(2deg)}}
.ttl{font-family:"Courier New",monospace;font-weight:900;text-align:center;line-height:.95;text-transform:uppercase;letter-spacing:3px;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.ttl span{display:block;background:linear-gradient(#fff6a8 25%,#ffb02e 60%,#e8590c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:5px #2a1608;paint-order:stroke fill;filter:drop-shadow(0 5px 0 #7a2e1c) drop-shadow(0 12px 0 rgba(0,0,0,.35))}
.ttl .t1{font-size:clamp(30px,6.5vw,78px)}.ttl .t2{font-size:clamp(44px,10vw,118px)}
.sub{color:#fff;font-weight:bold;text-shadow:0 2px 0 #2a1608,0 0 8px rgba(0,0,0,.5);font-size:clamp(12px,1.8vw,18px);text-align:center}
.fm{background:#fffaf0;border:4px solid #2a1608;box-shadow:7px 7px 0 rgba(0,0,0,.45);padding:16px 18px;display:flex;flex-direction:column;gap:10px;align-items:stretch;width:min(340px,86vw);color:#2b2118}
.fm label{font-weight:bold;font-size:13px}.fm input{font:inherit;font-size:18px;padding:9px 10px;border:3px solid #2a3b4a;background:#fff;color:#2b2118;outline:none}.fm input:focus{border-color:#e8590c;box-shadow:0 0 0 3px rgba(232,89,12,.3)}
#nmerr{color:#c62828;font-size:12px;min-height:14px;font-weight:bold}
#play{font:inherit;font-weight:900;font-size:24px;letter-spacing:2px;color:#fff;background:linear-gradient(#8be05f,#3f9e2f);border:4px solid #2a1608;padding:10px;cursor:pointer;box-shadow:0 6px 0 #22661a,0 10px 0 rgba(0,0,0,.35);text-shadow:0 2px 0 #1b4a14;transition:transform .08s,box-shadow .08s}
#play:hover{filter:brightness(1.08);transform:translateY(-2px)}#play:active{transform:translateY(5px);box-shadow:0 1px 0 #22661a}
#play.shk{animation:shk .35s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#rkbox{display:none;position:absolute;right:clamp(10px,3vw,40px);top:50%;transform:translateY(-50%);width:min(280px,26vw);background:#fffaf0;color:#2b2118;border:4px solid #2a1608;box-shadow:6px 6px 0 rgba(0,0,0,.45)}
@media(max-width:900px){#rkbox{display:none}}
.fl{position:absolute;image-rendering:pixelated;animation:flt 3s ease-in-out infinite;opacity:.95}
#fin{position:fixed;inset:0;z-index:25;display:none;overflow:auto;box-sizing:border-box;padding:clamp(12px,3vw,40px);background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 16px,transparent 16px 32px),linear-gradient(#2d4f7a,#5b8cc4 60%,#79bcf0)}
.fw{max-width:960px;margin:0 auto}.ftop{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
#fbk,#fnx{font:inherit;font-weight:bold;cursor:pointer;border:3px solid #2a1608;box-shadow:3px 3px 0 rgba(0,0,0,.45)}#fbk{background:#fffaf0;color:#2a1608;padding:9px 16px}
#rkmode{font-size:11px;font-weight:bold;color:#9fe49b;background:#2a1608;padding:5px 10px;letter-spacing:1px}
#fin h1{margin:14px 0 2px;font-size:clamp(38px,8vw,84px);text-transform:uppercase;letter-spacing:4px;line-height:1;background:linear-gradient(#fff6a8 25%,#ffb02e 60%,#e8590c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:5px #2a1608;paint-order:stroke fill;filter:drop-shadow(0 5px 0 #7a2e1c) drop-shadow(0 10px 0 rgba(0,0,0,.3))}
#fsub{color:#fff;text-shadow:0 2px 0 #2a1608;font-weight:bold;margin:8px 0 14px;font-size:clamp(12px,1.6vw,16px)}
#fsum{display:none;margin-bottom:12px;padding:10px 14px;background:#fff1b0;border:3px solid #2a1608;font-weight:bold;text-align:center;font-size:clamp(13px,1.8vw,18px)}
.fcard{background:#fffaf0;color:#2b2118;border:4px solid #2a1608;box-shadow:8px 8px 0 rgba(0,0,0,.45)}
.tr{display:grid;grid-template-columns:56px 1fr 90px 80px 100px;align-items:center;gap:8px;padding:clamp(6px,1.2vh,11px) 14px;border-bottom:2px solid #e5dcc0;font-size:clamp(14px,2vw,20px)}
.tr.th{background:#2a3b4a;color:#ffd23c;font-size:11px;font-weight:bold;letter-spacing:1px;padding:9px 14px;border-bottom:0}
.tr .c2{text-align:right}.tr b{text-align:right;color:#b5502a;font-size:1.1em}.tr.th span:last-child{text-align:right}
.pn{display:flex;align-items:center;font-weight:bold;overflow:hidden;white-space:nowrap}.pn img{width:36px;height:23px;margin-right:8px;image-rendering:pixelated;filter:drop-shadow(0 0 4px #ffd23c)}
.md{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;border:3px solid #2a1608;background:#fff;color:#2a1608}
.md.m1{background:#ffd23c}.md.m2{background:#d7dde3}.md.m3{background:#e8905a}
.tr.me{background:#ffe9a8;outline:3px solid #e8590c;outline-offset:-3px}.tr.empty{display:block;text-align:center;font-size:14px;padding:20px}.tr.flash{animation:fl .9s ease-out}
#fme{color:#fff;text-shadow:0 2px 0 #2a1608;font-weight:bold;text-align:center;margin:14px 0 4px;min-height:18px}
#fnx{display:none;margin:12px auto 0;font-weight:900;font-size:clamp(16px,2.4vw,22px);color:#fff;background:linear-gradient(#8be05f,#3f9e2f);padding:10px 26px;box-shadow:0 5px 0 #22661a}
@media(max-width:560px){.tr{grid-template-columns:44px 1fr 70px}.tr .c2{display:none}}
</style></head><body>
<canvas id="c"></canvas>
<div class="ov" id="ord"></div>
<div class="ov card" id="task" style="display:none"></div>
<div class="ov card" id="q"></div>
<div class="ov" id="msg"></div>
<div class="ov" id="pad"><button data-k="arrowleft">◀</button><button data-k="arrowup">▲</button><button data-k="arrowdown">▼</button><button data-k="arrowright">▶</button><button id="eb" style="width:auto;padding:0 12px">Interagir</button></div>
<div id="zoom"><div id="zf"><div class="fo"><div class="fi"><div class="gl"><div class="bx b1"></div><div class="bx b2"></div><svg class="ln" viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M0 4 Q50 14 100 5" stroke="#e8e0c8" stroke-width="1.5" fill="none"/></svg><div id="tks"></div></div></div><i class="rv r1"></i><i class="rv r2"></i><i class="rv r3"></i><i class="rv r4"></i></div><div id="zvar"></div><button id="zok">Pegar o pedido ✔</button></div></div>
<div class="ov" id="me"></div>
<button class="ov" id="rkb">🏆 RANKING</button>
<div id="start">
<img class="fl" data-s="l_tom" style="left:8%;top:14%;width:70px"><img class="fl" data-s="l_alf" style="left:16%;bottom:16%;width:64px;animation-delay:.5s"><img class="fl" data-s="l_ovo" style="right:30%;top:10%;width:44px;animation-delay:1s"><img class="fl" data-s="l_ceb" style="left:34%;bottom:8%;width:46px;animation-delay:1.4s"><img class="fl" data-s="l_pic" style="right:22%;bottom:12%;width:90px;animation-delay:.8s">
<div class="hero"><img class="chf" data-s="chef"><div class="ttl"><span class="t1">Fome de</span><span class="t2">Lógica</span></div><img class="brg" data-s="bl"></div>
<div class="sub">Aprenda lógica de programação cozinhando! 🍔</div>
<div class="fm"><label for="nm">Seu nome:</label><input id="nm" maxlength="14" placeholder="Digite aqui..." autocomplete="off"><div id="nmerr"></div><button id="play">▶ PLAY</button></div>
<div id="rkbox"><div class="rkh"><span>🏆 TOP 5</span></div><div id="rkS"></div></div>
</div>
<div id="fin"><div class="fw"><div class="ftop"><button id="fbk">← VOLTAR</button><span id="rkmode"></span></div><h1>Ranking</h1><div id="fsub"></div><div id="fsum"></div><div class="fcard" id="fnl"></div><div id="fme"></div><button id="fnx">▶ Novo pedido</button><button id="rkclr">🗑 LIMPAR RANKING</button></div></div>
<div id="pick"><div id="pkf"><div class="pkh"><b id="pkt"></b><button id="pkx">✕ fechar</button></div><div id="pkb"></div><div id="pkm"></div></div></div>
<script>

// ===== pontuação, ranking e tela inicial =====
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let NAME='',SCORE=0,WINS=0,ERRS=0,STARTED=false,ME_ID=null,DBR=null,WR=false,DIRTY=false,SAVEQ=null;const RK={raw:[],resetT:0,prev:{},mode:'local'};
const $=id=>document.getElementById(id);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function hatURL(){const P={O:'#4a2c00',D:'#b07800',M:'#e0a800',L:'#ffd23c',H:'#fff6b0',B:'#7a4e00'},
 R=['........OOO.........','.......OHLDO........','....OOOOOOOOOOOO....','..OOLHHLLLLMMMDDOO..','.OLHHLLLLLMMMMMDDDO.','OLHLLLLLLMMMMMMMDDDO','OLLLLLLLMMMMMMMMDDDO','OMLLLLMMMMMMMMMDDDDO','OMMMMMMMMMMMMDDDDDDO','.ODMMMMMMMMDDDDDDDO.','..OOBBBBBBBBBBBBOO..','...OBDBDBDBDBDBDBO..','....OOOOOOOOOOOOO...'];
 const c=document.createElement('canvas');c.width=20;c.height=13;const g=c.getContext('2d');R.forEach((row,y)=>[...row.slice(0,20)].forEach((ch,x)=>{if(P[ch]){g.fillStyle=P[ch];g.fillRect(x,y,1,1)}}));return c.toDataURL()}
const HAT=hatURL();
function updateMe(){$('me').innerHTML='👤 '+esc(NAME||'—')+' &nbsp;⭐ <b>'+SCORE+'</b>'}
function bump(n){SCORE+=n;updateMe();rkSave()}
function rkList(){return RK.raw.filter(e=>e&&e.t>=RK.resetT&&e.score>0).sort((a,b)=>b.score-a.score||a.t-b.t)}
function rkFill(el,lim){const L=rkList().slice(0,lim);el.innerHTML=L.length?L.map((e,i)=>{const ch=RK.prev[e.id]!==undefined&&RK.prev[e.id]!==e.score?' flash':'';return '<div class="rr'+(e.id==ME_ID?' me':'')+ch+(i==0?' first':'')+'"><b>'+(i+1)+'</b><span class="hw">'+(i==0?'<img src="'+HAT+'">':'')+'</span><span class="nm">'+esc(e.name)+'</span><em>'+e.score+'</em></div>'}).join(''):'<div class="rr empty">Ninguém pontuou ainda. Seja o primeiro! 🍔</div>'}
function rkTable(el){const L=rkList(),T=L.slice(0,10);
 el.innerHTML='<div class="tr th"><span>#</span><span>CHEF</span><span class="c2">PEDIDOS</span><span class="c2">ERROS</span><span>PONTOS</span></div>'+(T.length?T.map((e,i)=>{const ch=RK.prev[e.id]!==undefined&&RK.prev[e.id]!==e.score?' flash':'';return '<div class="tr'+(e.id==ME_ID?' me':'')+ch+'"><span class="md m'+(i<3?i+1:0)+'">'+(i+1)+'</span><span class="pn">'+(i==0?'<img src="'+HAT+'">':'')+esc(e.name)+'</span><span class="c2">'+(e.wins||0)+'</span><span class="c2">'+(e.errs||0)+'</span><b>'+e.score+'</b></div>'}).join(''):'<div class="tr empty">Ninguém pontuou ainda. Seja o primeiro! 🍔</div>');
 $('fsub').textContent=L.length+' chef'+(L.length==1?'':'s')+' no ranking · top 10';const p=L.findIndex(e=>e.id==ME_ID);$('fme').textContent=p>=10?'Sua posição: '+(p+1)+'º · '+L[p].score+' pts':''}
function rkRender(){rkTable($('fnl'));rkFill($('rkS'),5);RK.prev={};RK.raw.forEach(e=>RK.prev[e.id]=e.score)}
function localRead(){try{const o=JSON.parse(lsGet('fl_rank')||'{}');return Object.keys(o).map(k=>Object.assign({id:k},o[k]))}catch(e){return[]}}
function localWrite(rec){let o={};try{o=JSON.parse(lsGet('fl_rank')||'{}')}catch(e){}o[ME_ID]=rec;lsSet('fl_rank',JSON.stringify(o));RK.raw=localRead();rkRender()}
function rkReset(t){if(t>RK.resetT){RK.resetT=t;const seen=+lsGet('fl_reset')||0;if(t>seen){lsSet('fl_reset',String(t));if(STARTED){SCORE=WINS=ERRS=0;updateMe()}}rkRender()}}
function srvApply(d){RK.raw=d.list||[];if(d.resetT>RK.resetT)rkReset(d.resetT);else rkRender()}
async function srvTry(){try{if(!/^https?:/.test(location.protocol))return;const r=await fetch('/api/ranking',{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(!d||!Array.isArray(d.list))return;
 RK.mode='srv';ME_ID=lsGet('fl_uid')||('l'+Math.random().toString(36).slice(2,10));lsSet('fl_uid',ME_ID);srvApply(d);
 try{const es=new EventSource('/api/stream');es.onmessage=ev=>{try{srvApply(JSON.parse(ev.data))}catch(e){}}}catch(e){}
 setInterval(async()=>{try{const r=await fetch('/api/ranking',{cache:'no-store'});srvApply(await r.json())}catch(e){}},5000)}catch(e){}}
async function rkInit(){let ok2=false;await srvTry();
 try{if(RK.mode!='srv'&&window.claude&&claude.use){const r=await Promise.all([claude.use('db'),claude.use('user')]);if(r[0]){DBR=r[0];ME_ID=r[1]?await r[1].id():null;ok2=true}}}catch(e){}
 if(!ME_ID){ME_ID=lsGet('fl_uid')||('l'+Math.random().toString(36).slice(2,10));lsSet('fl_uid',ME_ID)}
 if(ok2){RK.mode='db';DBR.collection('ranking').onSnapshot(s=>{RK.raw=s.docs.map(d=>Object.assign({id:d.id},d.data()));rkRender()},()=>{});DBR.doc('meta/reset').onSnapshot(s=>{rkReset(s.exists?(+s.data().t||0):0)},()=>{})}
 else if(RK.mode!='srv'){RK.resetT=+lsGet('fl_reset')||0;RK.raw=localRead();addEventListener('storage',()=>{RK.raw=localRead();rkRender()})}
 $('rkmode').textContent=RK.mode=='srv'?'● ao vivo · servidor':RK.mode=='db'?'● ao vivo · todos os jogadores':'● só neste navegador';rkRender()}
function rkSave(){if(!STARTED||!NAME)return;DIRTY=true;if(WR||SAVEQ)return;SAVEQ=setTimeout(rkFlush,500)}
async function rkFlush(){SAVEQ=null;if(WR)return;WR=true;while(DIRTY){DIRTY=false;const rec={name:NAME,score:SCORE,wins:WINS,errs:ERRS,t:Date.now()};try{if(RK.mode=='srv')await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:ME_ID,name:NAME,score:SCORE,wins:WINS,errs:ERRS})});else if(RK.mode=='db')await DBR.doc('ranking/'+ME_ID).set(rec);else localWrite(rec)}catch(e){}}WR=false}
async function rkClear(){const t=Date.now();SCORE=WINS=ERRS=0;updateMe();
 try{if(RK.mode=='srv'){await fetch('/api/clear',{method:'POST'})}else if(RK.mode=='db'){await DBR.doc('meta/reset').set({t});try{const s=await DBR.collection('ranking').get();for(const d of s.docs){try{await DBR.doc('ranking/'+d.id).delete()}catch(e){}}}catch(e){}}
  else{lsSet('fl_rank','{}');lsSet('fl_reset',String(t));RK.raw=[];RK.resetT=t;rkRender()}say('Ranking limpo para todos.')}catch(e){say('Não foi possível limpar o ranking.')}}
let FINEND=false;
function openRk(end){FINEND=end;$('fnx').style.display=end?'block':'none';$('fbk').style.display=end?'none':'inline-block';$('fsum').style.display=end?'block':'none';$('rkclr').style.display=ADM?'block':'none';$('fin').style.display='block';$('fin').scrollTop=0;rkRender()}
function closeRk(){$('fin').style.display='none'}
function rkAdmUI(){const d=ADM?'block':'none';$('rkclr').style.display=d;$('rkb').style.display=d;$('rkbox').style.display=d;if(!ADM&&!FINEND)closeRk()}
function showFinal(){Q.style.display='none';if(SAVEQ){clearTimeout(SAVEQ);rkFlush()}$('fsum').innerHTML='🎉 Pedido entregue! <b>+50</b> · Erros neste pedido: '+G.err;openRk(true)}
$('fbk').onclick=closeRk;addEventListener('keydown',e=>{if(e.key=='Escape'&&!FINEND)closeRk()});
$('fnx').onclick=()=>{$('fin').style.display='none';start()};
let clrT=0;$('rkclr').onclick=()=>{const b=$('rkclr');if(!clrT){b.textContent='Tem certeza? Clique de novo';clrT=setTimeout(()=>{clrT=0;b.textContent='🗑 LIMPAR RANKING'},3000)}else{clearTimeout(clrT);clrT=0;b.textContent='🗑 LIMPAR RANKING';rkClear()}};
$('rkb').onclick=()=>openRk(false);
function toggleAdm(){toggleAdm0();rkAdmUI()}
function ans(j){const t=G.t[G.i];
 if(j==t.q.c){bump(t.q.w?5:10);const e=expl(t);if(t.a=='pass'){say('💡 '+plain(e));done();return}G.locked=false;Q.style.display='none';tsk(short(t),'💡 '+plain(e)+' · '+plain(t.d))}
 else{G.err++;t.q.w=(t.q.w||0)+1;Q.querySelector('#fb').textContent=t.q.w>1?'Ainda não. Dica: compare a regra com o papel do pedido.':'Ainda não. Tente de novo!'}}
function win(){G.locked=true;G.happy=1;WINS++;ERRS+=G.err;bump(50);tsk('');Q.style.display='block';Q.innerHTML='<div class="qh"><span>🎉 PEDIDO ENTREGUE</span></div><div class="qb"><p class="qt">O cliente adorou! ❤ <b>+50 pontos</b></p><p>Erros de lógica: '+G.err+'</p><button id="nx"><em>▶</em>Novo pedido</button></div>';$('nx').onclick=start;say('');showFinal()}
function playGame(){const n=$('nm').value.trim().slice(0,14),b=$('play');if(!n){$('nmerr').textContent='Digite seu nome para jogar!';b.classList.remove('shk');void b.offsetWidth;b.classList.add('shk');$('nm').focus();return}
 NAME=n;lsSet('fl_name',n);const mine=RK.raw.find(e=>e.id==ME_ID&&e.t>=RK.resetT);SCORE=mine?mine.score:0;WINS=mine&&mine.wins||0;ERRS=mine&&mine.errs||0;STARTED=true;keys={};updateMe();$('me').style.display='block';
 $('start').classList.add('out');setTimeout(()=>{$('start').style.display='none'},550);start();rkSave()}
addEventListener('keydown',e=>{if(e.target&&e.target.tagName=='INPUT')e.stopPropagation()},true);
$('play').onclick=playGame;$('nm').addEventListener('keydown',e=>{if(e.key=='Enter')playGame()});$('nm').value=lsGet('fl_name')||'';
document.querySelectorAll('#start [data-s]').forEach(i=>{const m=i.dataset.s=='chef'?CHEF:IM[i.dataset.s];if(m)i.src=m.src});
rkInit();
start();loop();
</script></body></html>
